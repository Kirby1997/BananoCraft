# Wallet mode:
#   node  - (default) the Banano node holds the wallet and signs everything. IP must be YOUR OWN node
#           with RPC control enabled, because the seed is imported into it (wallet_create).
#   light - no node wallet needed. The plugin derives keys from the seed itself, signs blocks and
#           generates the proof-of-work on this server, and only publishes finished blocks with the
#           `process` RPC. IP may then be ANY Banano RPC endpoint, including a public one: it never
#           sees the seed or any key. The seed never leaves this server.
# Switching modes: set walletMode and restart (see "Light wallet mode" in the README). Accounts and
# the seed stay the same, so no funds move.
walletMode: node

# Light mode only: CPU threads for local proof-of-work (measured: 1 thread ~3.7 s per block on average,
# 2 threads ~1.7 s average / ~6 s worst case; each tip is a send plus the recipient's receive). Default 2.
# Vault calls from other plugins are synchronous, so a payment can block the main thread for this long
# when no pre-computed work is ready: use 2 or more threads, and node mode for heavy Vault shop traffic.
# Light mode supports exactly ONE server per wallet seed.
workThreads: 2

# Light mode only: representative given to new accounts. Falls back to the first entry of
# `representatives` below, then to the master wallet itself. Leave empty to use that fallback.
defaultRepresentative: ""

# Startup backfill (both modes): accounts created by older versions have no stored derivation index.
# At startup the plugin derives addresses 0..walletIndexScanLimit from the seed(s) and matches them
# to those records. Records still unmatched are logged at SEVERE (in light mode they cannot spend).
# Raise this if you ever created more than 10000 accounts in one wallet.
walletIndexScanLimit: 10000

IP: "INSERT NODE IP HERE"
walletSeed: "INSERT WALLET SEED HERE"
# Don't touch walletID unless you know what you're doing
walletID: "INSERT WALLET ID FROM NODE HERE"
# Don't touch masterWallet unless you know what you're doing
masterWallet: "INSERT MASTER WALLET HERE"

# Bank accounts — uncomment bankWalletSeed and set it to enable Vault bank support.
# On first startup the plaintext seed is automatically encrypted in-place.
# Keep secret.key safe — losing it means the seed must be re-entered in plaintext.
# Don't touch bankWalletID — it is auto-populated on first run.
#bankWalletSeed: "INSERT BANK WALLET SEED HERE"
#bankWalletID: ""

# Database - for mongoDB, add the mongoURI (comment if using alternative)
# If MongoDB is unreachable at startup the plugin logs an error and disables itself.
#mongoURI: "INSERT MONGOURI HERE"

# Database - for MySQL, uncomment and populate the mysql config (comment if using alternative)
#mysqlServerName: "dbservername"
#mysqlPort: 3306
#mysqlDatabaseName: "dbname"
#mysqlUsername: "dbusername"
#mysqlPassword: "dbpassword"

allowofflinepayment: false

multiplier: "100000000000000000000000000000" #banano
#multiplier: "10000000000000000000000000" #nano

exploreaccount: "https://creeper.banano.cc/explorer/account/" #banano
#exploreaccount: "https://nanocrawler.cc/explorer/account/" #nano
exploreblock: "https://creeper.banano.cc/explorer/block/" #banano
#exploreblock: "https://nanocrawler.cc/explorer/block/" #nano

# Representatives BananoCraft may assign to a player's account (via /representative set random, or
# automatically after another plugin verifies wallet ownership by asking for a temporary
# representative change). Leave empty to instead pick randomly from whatever the node
# currently reports via representatives_online.
representatives: []
#representatives:
#  - "ban_1representativeaddress..."
#  - "ban_1anotherrepresentativeaddress..."
