# BananoEconomy default message bundle (English)
# Placeholders use MessageFormat syntax: {0}, {1}, {2}, ...
# Literal apostrophes must be doubled: it''s

# ---------------------------------------------------------------------------
# Join event
# ---------------------------------------------------------------------------
join.welcome=This server is running BananoEconomy!
join.see_code=See the code!
join.wallet_error=Your BananoEconomy wallet could not be configured! The node or database may be unavailable. Please try again by logging out and logging back in later.
join.wallet_error_generic=There was an error configuring your BananoEconomy wallet!
join.offline_total=You have received transactions totalling {0} Banano while you were offline!

# ---------------------------------------------------------------------------
# Balance command
# ---------------------------------------------------------------------------
balance.current=Your current balance is: {0} bans
balance.error=An error occurred retrieving your balance! Please try again in a moment.

# ---------------------------------------------------------------------------
# Tip command
# ---------------------------------------------------------------------------
tip.wallet_not_setup=Your wallet has not been set up yet. Please try again in a moment.
tip.usage=You need to enter an amount to send and a player to send to:
tip.usage_format=/tip [amount] [playername] [optional message]
tip.amount_not_positive=Amount (''{0}'') has to be greater than 0
tip.amount_not_number=Amount (''{0}'') is not a number greater than 0
tip.self=You cannot tip yourself
tip.player_not_found=Player needs to be online for you to tip them, or a unique player could not be identified by name.
tip.sender_frozen=You cannot access your wallet because it is frozen!
tip.target_frozen=You cannot tip {0} because their wallet is frozen!
tip.sending=Tipping {0} with {1} bans.
tip.failed=Tip of {0} to {1} failed with: {2}

# ---------------------------------------------------------------------------
# Withdraw command
# ---------------------------------------------------------------------------
withdraw.frozen=Your account has been frozen.
withdraw.amount_not_positive=Amount has to be greater than 0.
withdraw.usage=Usage: /withdraw [amount|all] [ban_address]
withdraw.failed=/withdraw {0} {1} failed with: {2}

# ---------------------------------------------------------------------------
# Setrep command
# ---------------------------------------------------------------------------
representative.frozen=Your account has been frozen.
representative.usage=Usage: /representative <set <ban_address|random>|get>
representative.set_usage=Usage: /representative set <ban_address|random>
representative.set_success=Representative set to {0}.
representative.set_failed=Failed to set representative: {0}
representative.get_success=Current representative: {0}
representative.get_failed=Could not retrieve representative information: {0}

# ---------------------------------------------------------------------------
# Receive command
# ---------------------------------------------------------------------------
receive.frozen=Your account has been frozen.
receive.none_pending=You have no pending transactions to receive.
receive.success=Received {0,number,integer} pending transaction(s)!
receive.failed=Failed to receive pending transactions: {0}

# ---------------------------------------------------------------------------
# Deposit command
# ---------------------------------------------------------------------------
deposit.frozen=You cannot access your wallet because it is frozen!
deposit.address=Deposit bans to {0} address:
deposit.copy_hint=Click here to copy this wallet address to the clipboard
deposit.explorer_link=Click me to view {0} account in the block explorer

# ---------------------------------------------------------------------------
# Offline payments
# ---------------------------------------------------------------------------
offline.frozen=You cannot access your wallet because it is frozen!
offline.disabled=Offline tips are disabled!
offline.transaction_header=Transaction {0}: {1}
offline.none=You have no offline transactions to display.

# ---------------------------------------------------------------------------
# Transaction history
# ---------------------------------------------------------------------------
history.invalid_count=Invalid record count! Usage: /bc history <record count>
history.count_too_low=Record Count must be greater than {0}! Usage: /bc history <record count>
history.count_too_high=Record Count must be less than {0}! Usage: /bc history <record count>
history.no_records=No records found!
history.error=An error occurred retrieving your transaction history! Please try again in a moment.
history.col_date=Date
history.col_amount=Amount
history.col_confirmed=C
history.col_hash=Hash

# ---------------------------------------------------------------------------
# Rich / component messages (MessageGenerator)
# ---------------------------------------------------------------------------
msg.received=You have received {0} from {1} with block ID: {2}
msg.received_with_note=You have received {0} from {1} with block ID: {2} and attached message: {3}
msg.sent=You have sent {0} to {1} with block ID: {2}
msg.sent_with_note=You have sent {0} to {1} with block ID: {2} and attached message: {3}
msg.view_in_explorer=Click me to view the transaction in the block explorer
msg.copy_block_hash=Click me to copy the block hash to the clipboard
msg.view_offline_payments=Click here to display the transactions.
